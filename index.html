<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Testador Google Drive API - Biblioteca Técnica</title>
  <style>
    :root {
      --primary-color: #0088cc;
      --bg-color: #f4f6f9;
      --card-bg: #ffffff;
      --text-color: #333333;
      --border-radius: 8px;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-color);
      margin: 0;
      padding: 20px;
      display: flex;
      justify-content: center;
    }

    .container {
      width: 100%;
      max-width: 650px;
      background: var(--card-bg);
      padding: 25px;
      border-radius: var(--border-radius);
      box-shadow: 0 4px 15px rgba(0, 0, 0, 0.08);
    }

    h1 {
      font-size: 1.4rem;
      color: var(--primary-color);
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }

    .input-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-bottom: 15px;
    }

    label {
      font-weight: 600;
      font-size: 0.9rem;
    }

    input[type="text"] {
      width: 100%;
      padding: 12px;
      border: 1px solid #ccc;
      border-radius: var(--border-radius);
      box-sizing: border-box;
      font-size: 0.95rem;
    }

    button {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 12px;
      font-size: 1rem;
      font-weight: bold;
      border-radius: var(--border-radius);
      cursor: pointer;
      transition: background-color 0.2s ease;
    }

    button:hover {
      background-color: #006699;
    }

    .info-box {
      background-color: #e7f3fe;
      border-left: 4px solid var(--primary-color);
      padding: 10px;
      font-size: 0.85rem;
      border-radius: 4px;
      margin-bottom: 15px;
      word-break: break-all;
    }

    /* Container de Carregamento e Spinner Principal */
    .loading-container {
      display: none;
      flex-direction: column;
      align-items: center;
      gap: 10px;
      margin: 20px 0;
    }

    .spinner {
      width: 32px;
      height: 32px;
      border: 4px solid #e9ecef;
      border-top: 4px solid var(--primary-color);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }

    /* Mini Spinner para os botões */
    .mini-spinner {
      display: inline-block;
      width: 12px;
      height: 12px;
      border: 2px solid #ffffff;
      border-top: 2px solid transparent;
      border-radius: 50%;
      animation: spin 0.6s linear infinite;
      margin-right: 6px;
      vertical-align: middle;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    .progress-bar-text {
      font-family: monospace;
      font-size: 1rem;
      color: #333;
      font-weight: bold;
      letter-spacing: 1px;
    }

    .status {
      margin-top: 10px;
      font-size: 0.9rem;
      text-align: center;
      color: #666;
    }

    .results {
      margin-top: 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .file-card {
      background: #f8f9fa;
      border: 1px solid #e9ecef;
      padding: 12px 16px;
      border-radius: var(--border-radius);
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
    }

    .file-info {
      display: flex;
      align-items: center;
      gap: 10px;
      overflow: hidden;
    }

    .file-icon {
      font-size: 1.2rem;
    }

    .file-name {
      font-size: 0.9rem;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 280px;
    }

    .btn-download {
      background-color: #28a745;
      color: white;
      text-decoration: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: var(--border-radius);
      font-weight: bold;
      white-space: nowrap;
      cursor: pointer;
      border: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
    }

    .btn-download:hover {
      background-color: #218838;
    }

    .btn-download.disabled {
      background-color: #6c757d !important;
      color: #ffffff !important;
      cursor: not-allowed;
      pointer-events: none;
      opacity: 0.85;
    }

    .btn-folder {
      background-color: var(--primary-color);
      color: white;
      border: none;
      padding: 8px 14px;
      font-size: 0.85rem;
      border-radius: var(--border-radius);
      font-weight: bold;
      cursor: pointer;
      white-space: nowrap;
    }

    .btn-folder:hover {
      background-color: #006699;
    }

    /* Seção de Arquivos Baixados */
    .downloads-section {
      margin-top: 30px;
      border-top: 2px dashed #ddd;
      padding-top: 15px;
    }

    .downloads-title {
      font-size: 1rem;
      font-weight: bold;
      color: #555;
      margin-bottom: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .btn-reset {
      background-color: #dc3545;
      color: white;
      border: none;
      padding: 6px 12px;
      font-size: 0.78rem;
      border-radius: 5px;
      font-weight: bold;
      cursor: pointer;
    }

    .btn-reset:hover {
      background-color: #c82333;
    }

    .downloads-list {
      list-style-type: none;
      padding: 0;
      margin: 0;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    .downloads-list li {
      background: #e9f7ef;
      border: 1px solid #c3e6cb;
      padding: 8px 12px;
      border-radius: 6px;
      font-size: 0.85rem;
      color: #155724;
      display: flex;
      align-items: center;
      gap: 8px;
    }
  </style>
</head>
<body>

  <div class="container">
    <h1>Leitor de Pastas Google Drive</h1>

    <div class="input-group">
      <label for="folderInput">Link ou ID da Pasta do Google Drive:</label>
      <input 
        type="text" 
        id="folderInput" 
        placeholder="Cole o link completo ou o ID da pasta pública aqui"
        value="https://drive.google.com/drive/folders/14rnhFYF-vZA7I8PtDbqPw2xEc2naGL2W"
      />
      <button onclick="buscarArquivos()">Listar Arquivos</button>
    </div>

    <!-- Exibe o ID Limpo/Corrigido -->
    <div id="processedLinkBox" class="info-box" style="display: none;"></div>

    <!-- Spinner e Barra de Progresso Principal -->
    <div id="loadingContainer" class="loading-container">
      <div class="spinner"></div>
      <div id="progressBarText" class="progress-bar-text">⬜⬜⬜⬜⬜⬜⬜⬜⬜⬜ 0%</div>
    </div>

    <div id="status" class="status"></div>
    <div id="results" class="results"></div>

    <!-- Seção do Histórico de Baixados -->
    <div class="downloads-section">
      <div class="downloads-title">
        <div>
          <span>📥 Arquivos Baixados</span>
          <span id="downloadCounter" style="font-size: 0.85rem; color: #777;">(0)</span>
        </div>
        <button class="btn-reset" onclick="resetarAplicacao()">🗑️ Resetar Aplicação</button>
      </div>
      <ul id="downloadsList" class="downloads-list">
        <li style="background: #f8f9fa; border-color: #eee; color: #888;">Nenhum arquivo baixado nesta sessão.</li>
      </ul>
    </div>
  </div>

  <script>
    const API_KEY = "AIzaSyCnzf-Ji_bwbStZwAIAy9fxI6WiyfyFo9M";

    let pastaAtualId = "";
    
    // Recupera dados salvos no localStorage (Persistência)
    let baixadosSet = new Set(JSON.parse(localStorage.getItem("drive_baixados_ids") || "[]"));
    let arquivosBaixados = JSON.parse(localStorage.getItem("drive_baixados_nomes") || "[]");

    // Inicialização ao carregar a página
    window.addEventListener("DOMContentLoaded", () => {
      atualizarListaBaixadosUI();
    });

    // Função para extrair e tratar o ID do Link
    function extrairECorrigirFolderId(input) {
      if (!input) return "";
      let textoLimpo = input.trim();
      const match = textoLimpo.match(/folders\/([a-zA-Z0-9_-]+)/) || 
                    textoLimpo.match(/id=([a-zA-Z0-9_-]+)/);

      if (match && match[1]) {
        return match[1];
      }
      return textoLimpo.split('?')[0].split('&')[0];
    }

    // Salvar estado no localStorage
    function salvarEstado() {
      localStorage.setItem("drive_baixados_ids", JSON.stringify(Array.from(baixadosSet)));
      localStorage.setItem("drive_baixados_nomes", JSON.stringify(arquivosBaixados));
    }

    // Atualizar UI do Histórico de Baixados
    function atualizarListaBaixadosUI() {
      const listElement = document.getElementById("downloadsList");
      const counterElement = document.getElementById("downloadCounter");

      counterElement.innerText = `(${arquivosBaixados.length})`;

      if (arquivosBaixados.length === 0) {
        listElement.innerHTML = `<li style="background: #f8f9fa; border-color: #eee; color: #888;">Nenhum arquivo baixado nesta sessão.</li>`;
        return;
      }

      listElement.innerHTML = "";
      arquivosBaixados.slice().reverse().forEach(nomeArquivo => {
        const item = document.createElement("li");
        item.innerHTML = `✅ <b>${nomeArquivo}</b> <span style="font-size:0.75rem; color:#666;">- Baixado com sucesso</span>`;
        listElement.appendChild(item);
      });
    }

    // Animação da Barra de Progresso Principal
    function animarProgresso(callback) {
      const progressText = document.getElementById("progressBarText");
      const loadingContainer = document.getElementById("loadingContainer");
      loadingContainer.style.display = "flex";

      let percent = 0;
      const interval = setInterval(() => {
        percent += 10;
        const cheios = Math.floor(percent / 10);
        const vazios = 10 - cheios;
        
        const barra = "⬛".repeat(cheios) + "⬜".repeat(vazios);
        progressText.innerText = `${barra} ${percent}%`;

        if (percent >= 100) {
          clearInterval(interval);
          setTimeout(() => {
            loadingContainer.style.display = "none";
            if (callback) callback();
          }, 150);
        }
      }, 40);
    }

    // Download usando a API de Mídia em segundo plano (Opção 2 - Sem redirecionar nem pedir e-mail)
    async function iniciarDownload(btnElement, fileId, nomeArquivo) {
      if (baixadosSet.has(fileId)) return;

      // Desabilita o botão e exibe o mini spinner
      btnElement.innerHTML = `<span class="mini-spinner"></span> Baixando...`;
      btnElement.classList.add("disabled");

      try {
        const mediaUrl = `https://www.googleapis.com/drive/v3/files/${fileId}?alt=media&key=${API_KEY}`;
        const response = await fetch(mediaUrl);

        if (!response.ok) {
          throw new Error("Não foi possível baixar via API direta.");
        }

        const blob = await response.blob();
        const blobUrl = window.URL.createObjectURL(blob);

        // Dispara o download nativo do arquivo no navegador
        const a = document.createElement("a");
        a.href = blobUrl;
        a.download = nomeArquivo;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        window.URL.revokeObjectURL(blobUrl);

        // Registra e salva o arquivo como baixado
        baixadosSet.add(fileId);
        arquivosBaixados.push(nomeArquivo);
        salvarEstado();

        btnElement.innerHTML = `Baixado ✅`;
        atualizarListaBaixadosUI();

      } catch (error) {
        console.warn("Download via API falhou ou ultrapassou cota, usando abertura no Drive:", error);
        
        // Fallback: Abre a visualização direta no Drive caso o arquivo exija login/autenticação extra
        window.open(`https://drive.google.com/file/d/${fileId}/view`, '_blank');
        
        baixadosSet.add(fileId);
        arquivosBaixados.push(nomeArquivo);
        salvarEstado();

        btnElement.innerHTML = `Baixado ✅`;
        atualizarListaBaixadosUI();
      }
    }

    // Resetar Aplicação e Limpar Dados do LocalStorage
    function resetarAplicacao() {
      if (confirm("Deseja realmente limpar todo o histórico de downloads salvos?")) {
        baixadosSet.clear();
        arquivosBaixados = [];
        localStorage.removeItem("drive_baixados_ids");
        localStorage.removeItem("drive_baixados_nomes");
        pastaAtualId = "";
        
        atualizarListaBaixadosUI();
        
        // Re-renderiza a lista caso já haja arquivos exibidos na tela
        if (document.getElementById("results").children.length > 0) {
          buscarArquivos(true);
        }
      }
    }

    function abrirPasta(subfolderId) {
      document.getElementById("folderInput").value = subfolderId;
      buscarArquivos();
    }

    async function buscarArquivos(forcarRecarregamento = false) {
      const inputVal = document.getElementById("folderInput").value;
      const statusDiv = document.getElementById("status");
      const resultsDiv = document.getElementById("results");
      const processedBox = document.getElementById("processedLinkBox");

      if (!inputVal.trim()) {
        statusDiv.innerText = "Por favor, insira o link ou o ID de uma pasta pública.";
        return;
      }

      const folderId = extrairECorrigirFolderId(inputVal);

      processedBox.style.display = "block";
      processedBox.innerHTML = `⚙️ <b>Link Processado com Sucesso!</b><br>ID extraído da pasta: <code>${folderId}</code>`;

      if (folderId === pastaAtualId && !forcarRecarregamento) {
        statusDiv.innerText = "⚠️ Esta pasta já está carregada e sendo exibida na tela.";
        return;
      }

      statusDiv.innerText = "Consultando Google Drive API...";
      resultsDiv.innerHTML = "";

      animarProgresso(async () => {
        const url = `https://www.googleapis.com/drive/v3/files?q='${folderId}'+in+parents+and+trashed=false&fields=files(id,name,mimeType)&key=${API_KEY}`;

        try {
          const response = await fetch(url);
          const data = await response.json();

          if (data.error) {
            statusDiv.innerText = `Erro na API: ${data.error.message}`;
            return;
          }

          if (!data.files || data.files.length === 0) {
            statusDiv.innerText = "Nenhum arquivo encontrado ou a pasta não está pública.";
            return;
          }

          pastaAtualId = folderId;
          statusDiv.innerText = `Sucesso! ${data.files.length} arquivo(s) encontrado(s).`;

          data.files.forEach(file => {
            const isPdf = file.mimeType === "application/pdf";
            const isFolder = file.mimeType === "application/vnd.google-apps.folder";

            const card = document.createElement("div");
            card.className = "file-card";

            let icon = "📄";
            if (isFolder) icon = "📁";
            else if (isPdf) icon = "📕";

            const jaBaixado = baixadosSet.has(file.id);
            const nomeArquivoFormatado = file.name.replace(/'/g, "\\'");

            card.innerHTML = `
              <div class="file-info" ${isFolder ? `style="cursor:pointer;" onclick="abrirPasta('${file.id}')"` : ''}>
                <span class="file-icon">${icon}</span>
                <span class="file-name" title="${file.name}">${file.name}</span>
              </div>
              ${
                !isFolder 
                  ? `<button 
                        class="btn-download ${jaBaixado ? 'disabled' : ''}" 
                        onclick="iniciarDownload(this, '${file.id}', '${nomeArquivoFormatado}')">
                        ${jaBaixado ? 'Baixado ✅' : 'Baixar PDF'}
                     </button>`
                  : `<button class="btn-folder" onclick="abrirPasta('${file.id}')">Abrir Pasta 📁</button>`
              }
            `;

            resultsDiv.appendChild(card);
          });

        } catch (err) {
          console.error(err);
          statusDiv.innerText = "Ocorreu um erro ao conectar com o serviço.";
        }
      });
    }
  </script>
</body>
</html>
